  if(state==='settings'){if(e.key==='Escape'||e.key==='Backspace')setS(prev);return}
  if(state!=='play'){
    const k=e.key;
    if(state==='over'){back();return}
    if(k==='Enter'){state==='menu'?setS('select'):state==='select'?setS('stage'):start()}
    else if(k==='Escape'||k==='Backspace')setS(state==='stage'?'select':'menu');
    else if(k==='ArrowLeft'||k==='ArrowRight'){const d=k==='ArrowLeft'?-1:1;if(state==='select')cfg.ch=(cfg.ch+d+3)%3;else if(state==='stage')cfg.st=(cfg.st+d+3)%3;save()}
    return}

    g.fillStyle='#fff';g.font='600 22px system-ui';g.fillText('Toca para volver al menú',W/2,260);
  }
  if(state==='pause')drawPause();
}
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(t-last,100);last=t;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
